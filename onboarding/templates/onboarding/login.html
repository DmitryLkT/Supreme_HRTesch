{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Рядом</title><link rel="stylesheet" href="{% static 'onboarding/css/app.css' %}">
</head>
<body class="login-page">
<main class="login-card card">
    <div class="brand"><div class="brand-mark">Р</div><div class="brand-name">Рядом</div></div>
    <h1>Рады видеть тебя</h1><p class="muted">Войди, чтобы открыть материалы адаптации.</p>
    <form method="post" class="login-form">
        {% csrf_token %}{{ form.as_p }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit" class="btn btn-primary">Войти →</button>
    </form>
</main>
</body>
</html>
